# Daily free-node refresh.
#
# Runs the crawler (with the TCP connectivity probe so only reachable nodes are
# committed), writes providers/proxies.yaml, and commits it back if it changed.
# The image build workflow is triggered by this commit.
name: Update free nodes

on:
  schedule:
    # 01:15 UTC every day (run when traffic is low somewhere on Earth).
    - cron: "15 1 * * *"
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write   # to push the refreshed node file

concurrency:
  group: update-nodes
  # Don't cancel: a node refresh must run to completion.
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Keep fetched history so we can commit back.
          fetch-depth: 0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version

      - name: Build crawler (release)
        run: cd crawler && cargo build --release

      - name: Crawl free nodes
        # Rust crawler with the TCP reachability probe so only reachable nodes are
        # committed. Default sources = zhuhai-raw (+ EXTRA_SUBS if set).
        run: ./crawler/target/release/freebox --timeout 3 --max 200 --out providers/proxies.yaml

      - name: Commit refreshed nodes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A providers/proxies.yaml
          if ! git diff --cached --quiet; then
            git commit -q -m "ci(nodes): refresh free nodes [skip ci]
          $(git log --format='%ad' -1 --date=short 2>/dev/null || date -u +%Y-%m-%d)
          $(grep -cE '^[[:space:]]*- name:' providers/proxies.yaml | sed 's/^/nodes: /')"
            git push
          else
            echo "No changes — nodes still fresh."
          fi
