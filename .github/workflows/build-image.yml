# Build & publish the mihomo-freebox image to GHCR.
#
# Triggered when providers/proxies.yaml changes (i.e. right after the daily
# node refresh commits new nodes) — so every "fresh nodes" commit yields a new
# image baked with the latest nodes.  Also builds on Dockerfile/config/crawler
# changes and on manual dispatch.
#
# **Version tracking**: the image always tracks the *latest* mihomo release.
# The build queries the GitHub API for the newest mihomo tag and uses it both
# as the build-arg (so the correct kernel is baked in) and as an image tag
# (e.g. `ghcr.io/repo:v1.19.30`).  Override with the workflow_dispatch input.
name: Build image

on:
  schedule:
    # 02:30 UTC every day — runs after the node refresh + Pages publish, so
    # the daily image carries the freshest nodes AND the latest mihomo kernel.
    - cron: "30 2 * * *"
  push:
    paths:
      - "providers/proxies.yaml"
      - "ci/docker/**"
      - "config/**"
      - "crawler/**"
      - ".github/workflows/build-image.yml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: "mihomo release tag (e.g. v1.19.30); empty = latest"
        required: false
        default: ""

permissions:
  contents: read
  packages: write   # ghcr.io push

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Detect the latest mihomo release (follow mihomo versions) ───────
      - name: Resolve mihomo version
        id: mihomo_ver
        run: |
          INPUT_VER="${{ inputs.mihomo_version || '' }}"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          else
            VER=$(curl -fsSL \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
              | jq -r '.tag_name')
          fi
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "FATAL: could not resolve mihomo version" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved mihomo version: $VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (image tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest
            type=raw,value=${{ steps.mihomo_ver.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MIHOMO_VERSION=${{ steps.mihomo_ver.outputs.version }}
          cache-from: type=local,/tmp/.buildx-cache
          cache-to: type=local,/tmp/.buildx-cache,mode=max
